<?xml version="1.0" encoding="UTF-8"?>
<!-- Creafluxe sjabloon voor lasersnijden en graveren.
     Document: 600 x 305 mm (één plaat), 1 eenheid = 1 mm.
     Lagen: Snijden (rood), Lijngraveren (blauw), Vlakgraveren (zwart gevuld), Uitleg (wordt niet gemaakt).
     Verwijder de voorbeelden, teken je eigen ontwerp op de juiste laag en bewaar als SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="600mm" height="305mm" viewBox="0 0 600 305" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Creafluxe sjabloon 600 x 305 mm</title>
  <g inkscape:groupmode="layer" inkscape:label="Uitleg (wordt niet gemaakt)" id="uitleg" style="font-family:Manrope,Arial,sans-serif;font-size:5px;fill:#6b6b6b">
    <rect x="0.25" y="0.25" width="599.5" height="304.5" fill="none" stroke="#bdb5ad" stroke-width="0.5" stroke-dasharray="3 3"/>
    <rect x="2" y="2" width="596" height="301" fill="none" stroke="#e4dfda" stroke-width="0.3"/>
    <text x="8" y="12">Creafluxe sjabloon · plaat 600 × 305 mm · blijf binnen de binnenste rand (2 mm marge) · teken op ware grootte in mm</text>
    <text x="8" y="20">Rood (#FF0000, 0,1 mm) = snijden · Blauw (#0000FF, 0,1 mm) = lijngraveren of scoren · Zwart gevuld (#000000) = vlakgraveren</text>
    <text x="8" y="28">Zet tekst om naar contouren, vermijd dubbele lijnen en sluit alle snijvormen. Verwijder de voorbeelden hieronder.</text>
    <text x="20" y="128">Voorbeeld: label van 80 × 50 mm, uitgesneden, met gegraveerde tekst en een scorelijn</text>
    <text x="130" y="128" dx="110">Controlevierkant 10 × 10 mm</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Vlakgraveren (zwart gevuld)" id="vlakgraveren" fill="#000000" stroke="none">
    <path d="M38 96 V64 H46 L54 78 L62 64 H70 V96 H63 V78 L56 90 H52 L45 78 V96 Z"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Lijngraveren (blauw)" id="lijngraveren" fill="none" stroke="#0000ff" stroke-width="0.1">
    <path d="M26 104 H94"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Snijden (rood)" id="snijden" fill="none" stroke="#ff0000" stroke-width="0.1">
    <path d="M25 60 H95 A5 5 0 0 1 100 65 V105 A5 5 0 0 1 95 110 H25 A5 5 0 0 1 20 105 V65 A5 5 0 0 1 25 60 Z"/>
    <circle cx="90" cy="70" r="3"/>
    <rect x="240" y="60" width="10" height="10"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
